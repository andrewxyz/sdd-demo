name: CI

on:
  pull_request:
  push:
    branches: [master]

# Constitution Development Workflow: failure of any gate below blocks merge.
# Gates MUST NOT be bypassed or disabled in order to land a change.
jobs:
  unit:
    name: Unit tests and constitution gates (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # T081: this job deliberately does not start a database or a container.
      # If a unit test ever needs one, this job fails — which is the point.
      - name: Unit tests and ArchUnit constitution rules
        run: mvn -B test

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Integration tests
        run: mvn -B verify -DexcludedGroups=slow

  nightly-throughput:
    name: Throughput (SC-001)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Generates a 500,000-row fixture; too slow for every pull request.
      - name: Throughput test
        run: mvn -B verify -Dgroups=slow
