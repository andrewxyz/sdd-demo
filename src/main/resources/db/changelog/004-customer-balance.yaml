databaseChangeLog:
  - changeSet:
      id: 004-customer-balance
      author: ledgersync
      comment: >-
        Owned by an existing system of record. This feature updates balance and last_settled_at;
        it does not create or delete accounts. Money is NUMERIC(19,4) — no binary floating-point
        type appears anywhere in this model.
      changes:
        - createTable:
            tableName: customer_balance
            columns:
              - column:
                  name: account_number
                  type: VARCHAR(34)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_customer_balance
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(19,4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_settled_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

        - sql:
            comment: Account status drives the active-account check in FR-009.
            sql: >-
              ALTER TABLE customer_balance ADD CONSTRAINT ck_customer_balance_status
              CHECK (status IN ('ACTIVE', 'CLOSED', 'SUSPENDED'))
            rollback: ALTER TABLE customer_balance DROP CONSTRAINT ck_customer_balance_status
