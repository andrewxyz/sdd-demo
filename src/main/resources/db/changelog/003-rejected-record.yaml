databaseChangeLog:
  - changeSet:
      id: 003-rejected-record
      author: ledgersync
      comment: >-
        The operator's record of what did not settle (FR-013). Silent skipping is prohibited by
        Constitution IV, so every skipped item lands here.
      changes:
        - createTable:
            tableName: settlement_rejected_record
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rejected_record
                    nullable: false
              - column:
                  name: execution_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source_row_number
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: failing_field
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: rejection_reason
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              # Masked at write time (FR-031). Account numbers never reach storage in the clear.
              - column:
                  name: raw_row_excerpt
                  type: VARCHAR(512)
              - column:
                  name: rejected_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: settlement_rejected_record
            baseColumnNames: execution_id
            constraintName: fk_rejected_record_run
            referencedTableName: settlement_run
            referencedColumnNames: execution_id
            onDelete: CASCADE

        # FR-016 requires retrieval by execution id and by business date. Execution id is indexed
        # here; business date is served by the join to settlement_run, which is itself indexed on
        # business_date (changeset 001).
        - createIndex:
            tableName: settlement_rejected_record
            indexName: ix_rejected_record_execution
            columns:
              - column:
                  name: execution_id
