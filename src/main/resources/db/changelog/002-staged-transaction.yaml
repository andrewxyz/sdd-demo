databaseChangeLog:
  - changeSet:
      id: 002-staged-transaction
      author: ledgersync
      comment: >-
        Rows read from the file, held pending reconciliation. Nothing here touches a customer
        balance until the apply step runs (research R2).
      changes:
        - createTable:
            tableName: settlement_staged_transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_staged_transaction
                    nullable: false
              - column:
                  name: execution_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source_row_number
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(34)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              # Direction applied once, at staging, so the reconciliation aggregate is a plain
              # SUM() with no type logic in SQL (data-model.md section 2).
              - column:
                  name: signed_amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: settlement_staged_transaction
            baseColumnNames: execution_id
            constraintName: fk_staged_transaction_run
            referencedTableName: settlement_run
            referencedColumnNames: execution_id
            onDelete: CASCADE

        # Serves both the reconciliation aggregate and the per-account grouping in the apply step.
        - createIndex:
            tableName: settlement_staged_transaction
            indexName: ix_staged_transaction_exec_account
            columns:
              - column:
                  name: execution_id
              - column:
                  name: account_number
